<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Lacson | Portfolio</title>

    <!-- Style Imports -->
    <link rel="stylesheet" href="assets/css/main_style.css">
    <link rel="stylesheet" href="assets/css/colors.css">
    <link rel="stylesheet" href="assets/css/header_style.css">
    <link rel="stylesheet" href="assets/css/intro_style.css">
    <link rel="stylesheet" href="assets/css/activity_bar_style.css">

    <!-- Guidelines -->
    <link rel="stylesheet" href="assets/guidelines.css">

    <!-- 3rd Party Libraries -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <!-- Grainient Background -->
    <div id="grainient"></div>

    <!-- Activity Bar Container -->
    <div id="activity-bar-container"></div>

    <!-- Smooth Scroll Wrapper -->
    <div id="smooth-content">
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Intro Container -->
        <div id="intro-container"></div>

        <!-- Divider Container #1 -->
        <div class="divider-container guidelines">
            <hr>
            <p>■ [000]</p>
            <p>Banner</p>
        </div> 

        <!-- Banner Container -->
        <div id="banner-container"></div>

        <!-- Divider Container #2 -->
        <div class="divider-container guidelines">
            <hr>
            <p>■ [001]</p>
            <p>My Works</p>
        </div> 

        <!-- My Works Container -->
        <div id="my-works-container"></div>

        <!-- Divider Container #3 -->
        <div class="divider-container guidelines">
            <hr>
            <p>■ [002]</p>
            <p>My Skills</p>
        </div> 

        <!-- My Skills Container -->
        <div id="my-skills-container"></div>

        <!-- Divider Container #4 -->
        <div class="divider-container guidelines">
            <hr>
            <p>■ [003]</p>
            <p>My CV / Resume</p>
        </div> 

        <!-- My CV / Resume Container -->
        <div id="my-resume-container"></div>

        <!-- Divider Container #5 -->
        <div class="divider-container guidelines">
            <hr>
            <p>■ [004]</p>
            <p>Contact Me</p>
        </div> 

        <!-- Contact Container -->
        <div id="contact-me-container"></div>

        <!-- Footer Container -->
        <div id="footer-container"></div>

        <!-- Footer Container -->
    </div>

    <!-- Back to Top Button -->
    <button id="btn-back-to-top" type="button" class="btn-back-to-top rounded-circle shadow glass-effect border-glow-effect">
        <span class="material-symbols-outlined">arrow_upward</span>
    </button>

    <script>
        const backToTopButton = document.getElementById("btn-back-to-top");

        window.addEventListener('scroll', () => {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                backToTopButton.style.display = "flex";
            } else {
                backToTopButton.style.display = "none";
            }
        });

        backToTopButton.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>

    <!-- Script -->
    <script type="module" src="js/grainient.js"></script>
    
    <!-- Global GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>gsap.registerPlugin(ScrollTrigger);</script>

    <!-- Lenis Smooth Scroll (High Performance) -->
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

    <script src="js/loaders.js"></script>
    <script src="js/scrollVelocity.js"></script>
    <script src="js/scrollScaling.js"></script>
    <script src="js/borderGlow.js"></script>
    <script src="js/scrollSoap.js"></script>
    <script src="js/revealDividers.js"></script>

    <!-- 3rd Party JS Bundles -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
