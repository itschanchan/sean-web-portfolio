<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Lacson | Portfolio</title>

    <!-- Style Imports -->
    <link rel="stylesheet" href="assets/css/main_style.css">
    <link rel="stylesheet" href="assets/css/colors.css">
    <link rel="stylesheet" href="assets/css/header_style.css">
    <link rel="stylesheet" href="assets/css/intro_style.css">
    <link rel="stylesheet" href="assets/css/activity_bar_style.css">

    <!-- Guidelines -->
    <link rel="stylesheet" href="assets/guidelines.css">

    <!-- 3rd Party Libraries -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>

    <!-- Grainient Background -->
    <div id="grainient"></div>

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Activity Bar Container -->
    <div id="activity-bar-container"></div>

    <!-- Intro Container -->
    <div id="intro-container"></div>

    <!-- Activity Bar Container -->
    <div id="activity-bar-container"></div>
    
    <!-- Banner Container -->
    <div id="banner-container"></div>

    <!-- My Works Container -->
    <div id="my-works-container"></div>

    <!-- My Skills Container -->
    <div id="my-skills-container"></div>

    <!-- My CV / Resume Container -->
    <div id="my-resume-container"></div>

    <!-- Contact Container -->
    <div id="contact-me-container"></div>

    <!-- Back to Top Button -->
    <button id="btn-back-to-top" type="button" class="btn-back-to-top rounded-circle shadow glass-effect">
        <span class="material-symbols-outlined">arrow_upward</span>
    </button>

    <script>
        const backToTopButton = document.getElementById("btn-back-to-top");

        window.addEventListener('scroll', () => {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                backToTopButton.style.display = "flex";
            } else {
                backToTopButton.style.display = "none";
            }
        });

        backToTopButton.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>

    <!-- Script -->
    <script type="module" src="js/grainient.js"></script>
    <script src="js/loaders.js"></script>
    <script src="js/scrollVelocity.js"></script>
    <script src="js/scrollScaling.js"></script>

    <!-- 3rd Party JS Bundles -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
