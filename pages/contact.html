<div class="contact-form glass-effect border-glow-effect guidelines">
    <form>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email">

            <label for="company">Company Name [Optional]</label>
            <input type="text" id="company" name="company" placeholder="Your Company Name [Optional]">
            
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your Message"></textarea>
        </div>
        <div class="form-group">
            <button type="submit" class="submit-btn">Send Message</button>
        </div>
    </form>
</div>

<script>
    document.querySelector('.contact-form form').addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const company = document.getElementById('company').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!name || !email || !message) {
            alert("Please fill in all required fields.");
            return;
        }

        const targetEmail = "sean.andrei99@gmail.com";
        const subject = `Project Inquiry from ${name}`;
        
        let body = `Name: ${name}\nEmail: ${email}`;
        if (company) body += `\nCompany: ${company}`;
        body += `\n\nMessage:\n${message}`;

        const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(targetEmail)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        
        window.open(gmailUrl, '_blank', 'noopener,noreferrer');
    });
</script>
