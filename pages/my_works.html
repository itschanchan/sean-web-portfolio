<link rel="stylesheet" href="../assets/css/colors.css">
<link rel="stylesheet" href="../assets/css/my_works_style.css">

<!-- Guidelines -->
<link rel="stylesheet" href="../assets/guidelines.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="my-works guidelines" id="my-works">
    <h1>My Works</h1>
    <!-- <p>Here are some of the projects I have worked on:</p> -->
</div>

<!-- Container for Side-by-Side Layout -->
<div class="row works-container m-0 guidelines">
    <!-- Left Column: Sticky Carousel -->
    <div class="col-md-6 sticky-column guidelines">
        <div class="works-carousel guidelines">
            <!-- Bootstrap Carousel -->
            <div id="carouselExampleIndicators" class="carousel slide carousel-dark carousel-fade rounded-4 overflow-hidden" data-bs-interval="false">
                
                <!-- Carousel Indicators -->
                <div class="carousel-indicators">
                </div> 

                <div class="carousel-inner">
                    <!-- Carousel Images -->
                </div>

                <!-- Carousel Control Buttons -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Right Column: Scrolling Descriptions -->
    <div class="col-md-6 guidelines" id="works-descriptions-container">
        <!-- Scrolling Descriptions -->
    </div>
</div>

<script>
    async function loadWorks() {
        try {
            // Fetch data from external JSON file
            const response = await fetch('../data/works_data.json');
            if (!response.ok) throw new Error('Failed to load works data');
            
            const worksData = await response.json();

            const indicatorsContainer = document.querySelector('.carousel-indicators');
            const innerContainer = document.querySelector('.carousel-inner');
            const descriptionsContainer = document.getElementById('works-descriptions-container');

            worksData.forEach((data, index) => {
                const activeClass = index === 0 ? 'active' : '';
                const ariaCurrent = index === 0 ? 'aria-current="true"' : '';

                // Add carousel indicator
                indicatorsContainer.insertAdjacentHTML('beforeend', `<button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="${index}" class="${activeClass}" ${ariaCurrent} aria-label="Slide ${index + 1}"></button>`);

                // Add carousel image item
                innerContainer.insertAdjacentHTML('beforeend', `
                    <div class="carousel-item ${activeClass}">
                        <img src="${data.project_image}" class="d-block works-image" alt="${data.project_title}" referrerpolicy="no-referrer">
                    </div>`);

                // Generate tags HTML
                const tagsHtml = data.technologies 
                    ? data.technologies.map(tech => `<span class="badge bg-secondary me-1">${tech}</span>`).join('') 
                    : '';

                // Generate Team HTML
                const teamList = data.team ? data.team.join(', ') : '';

                // Add description section
                descriptionsContainer.insertAdjacentHTML('beforeend', `
                    <div class="works-description glass-effect d-flex flex-column" data-index="${index}">
                        <h2>${data.project_title}</h2>
                        <hr class="my-3" style="width: 100%; opacity: 0.2;">
                        
                        <div class="mb-3">Technologies: ${tagsHtml}</div>
                        <p>${data.project_description}</p>
                        <div class="mt-2"><strong>Team:</strong> ${teamList}</div>
                    </div>`);
            });

            initScrollInteractions();
        } catch (error) {
            console.error('Error loading works:', error);
        }
    }

    function initScrollInteractions() {
        const myCarousel = document.getElementById('carouselExampleIndicators');
        const carousel = new bootstrap.Carousel(myCarousel, { interval: false, wrap: true });
        const descriptions = document.querySelectorAll('.works-description');
        let isManualInteract = false;

        // Detect manual interaction (clicks on arrows/indicators)
        myCarousel.addEventListener('click', () => isManualInteract = true);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const index = entry.target.getAttribute('data-index');
                    if (index !== null) {
                        carousel.to(parseInt(index));
                    }
                }
            });
        }, { threshold: 0.5 }); // Trigger when 50% visible

        descriptions.forEach(section => observer.observe(section));

        myCarousel.addEventListener('slide.bs.carousel', event => {
            // Only scroll text if user manually clicked carousel controls
            if (isManualInteract) {
                const index = event.to;
                if (descriptions[index]) {
                    descriptions[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                isManualInteract = false;
            }
        });
    }

    loadWorks();
</script>

<!-- Bootstrap JS Bundle -->
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
